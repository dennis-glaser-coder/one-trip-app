<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOREYO – Travel made for you.</title>
<meta name="description" content="NOREYO – Travel made for you. Finde Hotels und Reisen, die wirklich zu deinen Wünschen passen.">
<meta name="application-name" content="NOREYO">
<meta name="apple-mobile-web-app-title" content="NOREYO">
<meta property="og:title" content="NOREYO – Travel made for you.">
<meta property="og:description" content="Premium-Reiseplattform für Hotels und Reisen, die zu deinen Wünschen passen.">
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#07111f;color:#fff}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}.boot-card{max-width:430px}.logo{font-size:34px;font-weight:900;letter-spacing:3.4px}.sub{margin-top:10px;opacity:.68;font-size:14px}.bar{height:4px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:22px auto 0;max-width:220px}.bar:after{content:"";display:block;width:45%;height:100%;background:#fff;border-radius:99px;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}#error{display:none;white-space:pre-wrap;line-height:1.45}.boot-retry{appearance:none;border:0;border-radius:14px;padding:12px 18px;min-height:44px;margin-top:18px;background:#fff;color:#07111f;font:800 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><div class="boot-card"><div class="logo">NOREYO</div><div class="sub" id="status">Reiseerlebnis wird geladen …</div><div class="bar" id="bar"></div><div id="error"></div></div></div>
<script>
(()=>{
'use strict';
const SRC='./noreyo-bootstrap-v971.js?build=971',ATTEMPTS=2,RETRY_MS=300,TIMEOUT_MS=15000;
let attempt=0,timer=0,done=false;
const status=document.getElementById('status'),bar=document.getElementById('bar'),error=document.getElementById('error');
function fail(message){if(done)return;done=true;if(timer){clearTimeout(timer);timer=0;}if(bar)bar.style.display='none';if(status)status.textContent='NOREYO konnte nicht geladen werden';if(!error)return;error.style.display='block';error.setAttribute('role','alert');error.setAttribute('aria-live','assertive');error.textContent='Die Verbindung zum Reisemodul ist fehlgeschlagen.';const button=document.createElement('button');button.type='button';button.className='boot-retry';button.textContent='Erneut versuchen';button.addEventListener('click',()=>location.reload());error.appendChild(document.createElement('br'));error.appendChild(button);try{button.focus({preventScroll:true});}catch(_){}console.error(message||'NOREYO bootstrap failed');}
function url(){attempt+=1;return SRC+(attempt>1?'&noreyo_outer_retry='+attempt:'');}
function load(){if(done)return;const script=document.createElement('script');let settled=false;const finish=(ok,reason)=>{if(settled||done)return;settled=true;if(timer){clearTimeout(timer);timer=0;}script.onload=script.onerror=null;if(ok){done=true;return;}try{script.remove();}catch(_){}if(attempt<ATTEMPTS){setTimeout(load,RETRY_MS);return;}fail(reason);};timer=setTimeout(()=>finish(false,'Bootstrap-Timeout'),TIMEOUT_MS);script.src=url();script.onload=()=>finish(true);script.onerror=()=>finish(false,'Bootstrap konnte nicht geladen werden');document.head.appendChild(script);}
load();window.NOREYO_OUTER_BOOT=Object.freeze({SRC,ATTEMPTS,RETRY_MS,TIMEOUT_MS});
})();
</script>
</body>
</html>
