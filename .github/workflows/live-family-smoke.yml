name: NOREYO Live Family Smoke

on:
  push:
    branches:
      - agent/v585-safety-on-main

permissions:
  contents: read

jobs:
  family-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live family hotel search, detail/reviews and anonymous PREBOOK boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error, zipfile
          from datetime import date, timedelta

          with zipfile.ZipFile('site.zip') as z:
              html = z.read('index.html').decode('utf-8', errors='ignore')
          m = re.search(r"const anonKey='([^']+)'", html)
          if not m:
              raise SystemExit('Could not resolve public Supabase anon key from packed client')
          anon = m.group(1)

          start = date.today() + timedelta(days=45)
          end = start + timedelta(days=3)
          base = 'https://fcvffslhnaqlwitaeers.supabase.co/functions/v1'
          search_endpoint = f'{base}/search-travel'
          detail_endpoint = f'{base}/hotel-detail'
          reviews_endpoint = f'{base}/hotel-reviews'
          prebook_endpoint = f'{base}/hotel-prebook'
          queries = ['family-friendly hotels in Mallorca', 'family-friendly hotels in Tenerife']
          last = None

          def find_key(value, wanted):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if str(key).replace('_','').lower() == wanted and isinstance(item, (str,int)) and str(item).strip():
                          return str(item).strip()
                  for item in value.values():
                      found = find_key(item, wanted)
                      if found:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found = find_key(item, wanted)
                      if found:
                          return found
              return None

          def post(endpoint, payload, timeout=35, allow_http_error=False):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'apikey': anon,
                      'Authorization': f'Bearer {anon}'
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      raw = res.read().decode('utf-8')
                      return res.status, (res.headers.get('X-Noreyo-Provider-Route') or '').strip().lower(), json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {}
                  if allow_http_error:
                      return e.code, (e.headers.get('X-Noreyo-Provider-Route') or '').strip().lower(), payload
                  raise SystemExit(f'Live provider request HTTP {e.code}: {raw[:1000]}')

          selected_offer_id = None
          selected_hotel_id = None
          for query in queries:
              request_body = {
                  'occupancies': [{'adults': 2, 'children': [5, 8]}],
                  'currency': 'EUR',
                  'guestNationality': 'DE',
                  'checkin': start.isoformat(),
                  'checkout': end.isoformat(),
                  'aiSearch': query,
                  'includeHotelData': True,
                  'roomMapping': True,
                  'maxRatesPerHotel': 1,
                  'limit': 5,
                  'timeout': 10,
                  'sessionId': 'github-live-family-smoke'
              }
              status, route, body = post(search_endpoint, request_body)
              if status != 200:
                  raise SystemExit(f'Unexpected HTTP status: {status}')
              if route != 'hotels':
                  raise SystemExit(f'Unexpected provider route: {route!r}')
              data = body.get('data')
              if isinstance(data, dict):
                  data = data.get('data')
              if not isinstance(data, list):
                  raise SystemExit('Provider response does not expose a hotel-rate list')
              last = (query, len(data))
              print(f'Live family search {query!r}: 2 adults + children ages 5/8, HTTP 200, route={route}, rate_items={len(data)}')
              if data:
                  selected_offer_id = find_key(data[0], 'offerid') or find_key(body, 'offerid')
                  selected_hotel_id = find_key(data[0], 'hotelid') or find_key(body, 'hotelid')
                  if not selected_offer_id:
                      raise SystemExit('Live hotel result did not expose a usable offerId for auth-boundary check')
                  if not selected_hotel_id:
                      raise SystemExit('Live hotel result did not expose a usable hotelId for detail/review checks')
                  print('PASS live Supabase/LiteAPI multi-child family hotel search returned bookable rate data')
                  break
          else:
              raise SystemExit(f'Both live multi-child family searches returned zero rate items; last={last}')

          status, _, detail = post(detail_endpoint, {'hotelId': selected_hotel_id, 'language': 'de'}, timeout=20)
          if status != 200 or not isinstance(detail, dict) or detail.get('error'):
              raise SystemExit(f'Live hotel detail failed: HTTP {status}: {json.dumps(detail)[:800]}')
          detail_id = find_key(detail, 'hotelid') or selected_hotel_id
          if str(detail_id) != str(selected_hotel_id):
              raise SystemExit(f'Hotel detail identity mismatch: search={selected_hotel_id!r}, detail={detail_id!r}')
          print(f'PASS live hotel detail resolved through Supabase -> LiteAPI for hotelId={selected_hotel_id}')

          status, _, reviews = post(reviews_endpoint, {'hotelId': selected_hotel_id, 'language': 'de', 'limit': 5}, timeout=22)
          if status != 200 or not isinstance(reviews, dict) or reviews.get('error'):
              raise SystemExit(f'Live hotel reviews failed: HTTP {status}: {json.dumps(reviews)[:800]}')
          print('PASS live hotel review path completed through Supabase -> LiteAPI (reviews or truthful empty state)')

          status, _, prebook = post(prebook_endpoint, {'offerId': selected_offer_id}, timeout=20, allow_http_error=True)
          code = str((prebook.get('error') or {}).get('code') or '') if isinstance(prebook, dict) else ''
          if status != 401 or code != 'AUTH_REQUIRED':
              raise SystemExit(f'Unexpected anonymous PREBOOK result HTTP {status}, code={code!r}: {json.dumps(prebook)[:1000]}')
          print('PASS anonymous hotel PREBOOK is rejected server-side with AUTH_REQUIRED before provider checkout')
          PY
