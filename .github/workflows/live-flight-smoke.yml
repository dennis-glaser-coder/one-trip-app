name: NOREYO Live Flight Smoke

on:
  push:
    branches:
      - agent/v585-safety-on-main

permissions:
  contents: read

jobs:
  flight-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run one live flight search through Supabase -> LiteAPI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error, zipfile
          from datetime import date, timedelta

          with zipfile.ZipFile('site.zip') as z:
              html = z.read('index.html').decode('utf-8', errors='ignore')
          m = re.search(r"const anonKey='([^']+)'", html)
          if not m:
              raise SystemExit('Could not resolve public Supabase anon key from packed client')
          anon = m.group(1)

          start = date.today() + timedelta(days=45)
          end = start + timedelta(days=5)
          endpoint = 'https://fcvffslhnaqlwitaeers.supabase.co/functions/v1/search-travel'
          routes = [('DUS','PMI'), ('FRA','PMI')]
          last = None

          def offers(payload):
              candidates = [
                  payload.get('data') if isinstance(payload, dict) else None,
                  payload.get('offers') if isinstance(payload, dict) else None,
                  payload.get('flights') if isinstance(payload, dict) else None,
              ]
              if isinstance(payload, dict) and isinstance(payload.get('data'), dict):
                  data = payload['data']
                  candidates.extend([data.get('data'), data.get('offers'), data.get('flights')])
              for candidate in candidates:
                  if isinstance(candidate, list):
                      return candidate
              return None

          for origin, destination in routes:
              payload = {
                  'action': 'flightSearch',
                  'legs': [
                      {'origin': origin, 'destination': destination, 'date': start.isoformat(), 'direction': 'OUTBOUND'},
                      {'origin': destination, 'destination': origin, 'date': end.isoformat(), 'direction': 'INBOUND'}
                  ],
                  'adults': 2,
                  'children': 2,
                  'childrenAges': [5, 8],
                  'infants': 0,
                  'infantAges': [],
                  'currency': 'EUR',
                  'country': 'DE'
              }
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'apikey': anon,
                      'Authorization': f'Bearer {anon}'
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=40) as res:
                      status = res.status
                      route = (res.headers.get('X-Noreyo-Provider-Route') or '').strip().lower()
                      body = json.loads(res.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  text = e.read().decode('utf-8', errors='replace')[:1000]
                  raise SystemExit(f'Live flight search HTTP {e.code}: {text}')

              if status != 200:
                  raise SystemExit(f'Unexpected HTTP status: {status}')
              if route != 'flights':
                  raise SystemExit(f'Unexpected provider route: {route!r}')
              data = offers(body)
              if data is None:
                  raise SystemExit('Provider response does not expose a recognizable flight-offer list')
              last = (origin, destination, len(data))
              print(f'Live flight search {origin}->{destination}: 2 adults + children ages 5/8, HTTP 200, route={route}, offers={len(data)}')
              if data:
                  print('PASS live Supabase/LiteAPI flight search returned offer data')
                  break
          else:
              raise SystemExit(f'Both live flight searches returned zero offers; last={last}')
          PY
