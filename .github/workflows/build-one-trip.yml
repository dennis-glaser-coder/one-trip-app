name: Build ONE TRIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site.zip
      - tools/apply_v528.py
      - .github/workflows/build-one-trip.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V5.28 from verified V5.27 package
        run: |
          unzip -p site.zip index.html > index.html
          python tools/apply_v528.py

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already up to date"
          else
            git commit -m "Build ONE TRIP V5.28"
            git push
          fi

# trigger build after connector setup
